name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The test suite uses only node:test and has no package dependencies,
      # so CI skips npm install and can't be broken by lockfile drift.
      - run: npm test
      - name: Syntax check the Worker
        run: node --check src/index.js
